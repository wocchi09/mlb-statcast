name: Daily Statcast update
on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-statcast
  cancel-in-progress: false
jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch current season
        run: python scripts/fetch_current.py
      - name: Rebuild current-season analytics
        run: python scripts/build_analytics.py --source 'data/current-season.parquet' --output site/data/analytics.json --name-cache data/player_names.json --merge-existing
      - name: Fetch scores and schedule
        run: python scripts/fetch_schedule.py
      - name: Fetch standings and official player stats
        run: python scripts/fetch_league.py
      - name: Archive current-season raw data in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-current >/dev/null 2>&1 || gh release create data-current --title "Current season data" --notes "Automatically updated Statcast snapshot"
          gh release upload data-current data/current-season.parquet --clobber
      - name: Commit refreshed site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/analytics.json site/data/analytics-summary.json site/data/schedule.json site/data/league.json data/player_names.json
          git diff --cached --quiet || git commit -m "Update Statcast analytics"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy refreshed analytics to Pages
        id: deployment
        uses: actions/deploy-pages@v4
