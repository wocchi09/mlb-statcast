<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLB STATCAST LAB</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script></head><body>
<header class="hero"><div class="hero-in"><div><h1>MLB STATCAST LAB</h1><p>Pitch-by-pitch analytics since 2015</p></div><div><a class="btn" href="https://wocchi-mlb-statcast.streamlit.app">詳細分析</a> <button class="btn" id="theme">☾</button></div></div></header>
<main class="wrap"><section class="controls"><label>シーズン <select id="season"></select></label><label>検索 <input id="search" placeholder="選手名・球種"></label><button class="btn" id="share">共有URL</button><span class="note" id="updated"></span></section>
<nav class="tabs" id="tabs"><button class="tab on" data-view="overview">概要</button><button class="tab" data-view="batters">打者</button><button class="tab" data-view="pitchers">投手</button><button class="tab" data-view="arsenal">球種</button><button class="tab" data-view="trends">トレンド</button><button class="tab" data-view="compare">選手比較</button><button class="tab" data-view="quality">データ品質</button><button class="tab" data-view="method">指標ガイド</button></nav>
<section id="view"></section></main><script src="app.js"></script></body></html>
